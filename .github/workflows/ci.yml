name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: tests/backend

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      # the full-length film tests make, join and check real video files
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m venv backend/.venv && backend/.venv/bin/pip install -r backend/requirements.txt
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e && npm run test:e2e:live && npm run test:e2e:supabase
        working-directory: frontend
        env: { OFFLINE_PHOTOS: '1' }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-results, path: frontend/test-results, retention-days: 7 }

  # The image Render deploys: build it, start it against Postgres, check it answers.
  docker:
    runs-on: ubuntu-latest
    needs: [backend]
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: cineai }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cineai-backend backend
      - name: Start the image (migrations run on start)
        run: |
          docker run -d --name api --network host \
            -e APP_ENV=staging -e PORT=8000 -e AUTH_MODE=supabase \
            -e SUPABASE_URL=https://example.supabase.co -e PUBLIC_BASE_URL=https://api.example.com \
            -e STORAGE_BACKEND=supabase -e DATABASE_URL=postgresql://postgres:postgres@localhost:5432/cineai \
            cineai-backend
      - name: Health, cast photos, sign-in required, ffmpeg present
        run: |
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf localhost:8000/health | grep -q '"status":"ok"'
          curl -sf -o /dev/null localhost:8000/portraits/female-adult.jpg
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/api/v1/projects)" = 401
          docker exec api ffmpeg -version | head -1
          docker exec api python -c "import sqlalchemy as s,os; e=s.create_engine('postgresql+psycopg://postgres:postgres@localhost:5432/cineai'); print(s.inspect(e).get_table_names())"
      - if: always()
        run: docker logs api
